# Standalone MinIO for Dokploy — S3 smoke-test companion for KnowHub.
#
# Domains (DNS A/AAAA → Dokploy host):
#   s3-dev.in3.technology         → S3 API   ← KnowHub endpoint
#   s3-console-dev.in3.technology → Console UI
#
# Why `gateway` exists:
# Dokploy domain routing often pins one container port per service. MinIO needs
# 9000 (API) and 9001 (console). The nginx gateway listens on **80** and routes
# by Host, so set BOTH Dokploy domains to container port **80**.
#
# Dokploy:
#   1. New Compose application → paste this file
#   2. Environment:
#        MINIO_ROOT_USER=...
#        MINIO_ROOT_PASSWORD=...   # strong secret
#   3. Domains (HTTPS) on service **gateway**, container port **80** for both hosts
#      (remove any old Traefik labels / domains pointed at minio:9000)
#   4. Deploy → open https://s3-console-dev.in3.technology
#   5. Create bucket `knowledge-hub` + an access key (prefer not root)
#
# KnowHub Admin → Storage:
#   Provider:           S3-compatible
#   Bucket:             knowledge-hub
#   Region:             us-east-1
#   Endpoint URL:       https://s3-dev.in3.technology
#   Force path-style:   yes
#   Key prefix:         staging
#   Access key / Secret: from MinIO
#   → Test connection → Save

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SERVER_URL: https://s3-dev.in3.technology
      MINIO_BROWSER_REDIRECT_URL: https://s3-console-dev.in3.technology
    volumes:
      - minio_data:/data
    networks:
      - default
    # Not published on dokploy-network — only gateway is.

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - minio
    networks:
      - default
      - dokploy-network
    # Dokploy Domains → this service, container port 80 (both hostnames).
    # If you prefer compose labels instead of the Domains UI, uncomment below
    # and do NOT also attach domains in Dokploy (avoid duplicate routers).
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=dokploy-network
    #   - traefik.http.routers.minio-gw.rule=Host(`s3-dev.in3.technology`) || Host(`s3-console-dev.in3.technology`)
    #   - traefik.http.routers.minio-gw.entrypoints=websecure
    #   - traefik.http.routers.minio-gw.tls=true
    #   - traefik.http.routers.minio-gw.tls.certresolver=letsencrypt
    #   - traefik.http.services.minio-gw.loadbalancer.server.port=80
    configs:
      - source: minio_nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  minio_nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        '' close;
      }

      # S3 API — KnowHub / AWS SDK
      server {
        listen 80;
        server_name s3-dev.in3.technology;

        client_max_body_size 0;
        ignore_invalid_headers off;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Connection "";
          chunked_transfer_encoding off;
          proxy_connect_timeout 300;
          proxy_read_timeout 300;
          proxy_send_timeout 300;
          proxy_pass http://minio:9000;
        }
      }

      # MinIO Console UI (WebSocket)
      server {
        listen 80;
        server_name s3-console-dev.in3.technology;

        client_max_body_size 0;
        ignore_invalid_headers off;
        proxy_buffering off;

        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_connect_timeout 300;
          proxy_read_timeout 300;
          proxy_send_timeout 300;
          proxy_pass http://minio:9001;
        }
      }

volumes:
  minio_data:

networks:
  dokploy-network:
    external: true
