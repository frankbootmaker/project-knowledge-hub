name: knowledge-hub-dev

services:
  postgres:
    # pgvector-enabled Postgres 16 (Milestone 10). Existing volumes usually keep data
    # across this image swap; do not use `down -v` unless you intend to wipe data.
    image: pgvector/pgvector:pg16
    container_name: knowledge-hub-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_hub
      POSTGRES_USER: knowledge_hub
      POSTGRES_PASSWORD: knowledge_hub
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - knowledge_hub_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowledge_hub -d knowledge_hub']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - knowledge_hub_dev_net

  redis:
    image: redis:7-alpine
    container_name: knowledge-hub-dev-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - knowledge_hub_dev_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - knowledge_hub_dev_net

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: knowledge-hub-dev-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: development
      API_PORT: 3101
      DATABASE_URL: postgres://knowledge_hub:knowledge_hub@postgres:5432/knowledge_hub
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:3100
      API_URL: http://localhost:3101
      LOG_LEVEL: info
      BACKUP_DIR: /backups
      MAIL_FROM: "${MAIL_FROM:-Project Knowledge Hub <noreply@localhost.local>}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      BACKUP_STALE_AFTER_HOURS: ${BACKUP_STALE_AFTER_HOURS:-36}
      BACKUP_STALE_ALERT_INTERVAL_MS: ${BACKUP_STALE_ALERT_INTERVAL_MS:-900000}
      BACKUP_OFFSITE_STALE_AFTER_HOURS: ${BACKUP_OFFSITE_STALE_AFTER_HOURS:-48}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ERROR_SPIKE_THRESHOLD: ${ALERT_ERROR_SPIKE_THRESHOLD:-50}
      ALERT_ERROR_SPIKE_WINDOW_MINUTES: ${ALERT_ERROR_SPIKE_WINDOW_MINUTES:-15}
      ALERT_DISK_FREE_RATIO_MIN: ${ALERT_DISK_FREE_RATIO_MIN:-0.1}
      ALERT_DISK_FREE_GB_MIN: ${ALERT_DISK_FREE_GB_MIN:-10}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      AUDIT_RETENTION_INTERVAL_MS: ${AUDIT_RETENTION_INTERVAL_MS:-86400000}
      MARKITDOWN_URL: ${MARKITDOWN_URL:-http://kh-markitdown:8080}
    volumes:
      - knowledge_hub_dev_backups:/backups
    ports:
      - '127.0.0.1:3101:3101'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - knowledge_hub_dev_net

  worker:
    profiles: ['full']
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: knowledge-hub-dev-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: development
      DATABASE_URL: postgres://knowledge_hub:knowledge_hub@postgres:5432/knowledge_hub
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:3100
      API_URL: http://localhost:3101
      WEB_PORT: 3100
      API_PORT: 3101
      LOG_LEVEL: info
      BACKUP_DIR: /backups
      MAIL_FROM: "${MAIL_FROM:-Project Knowledge Hub <noreply@localhost.local>}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      BACKUP_STALE_AFTER_HOURS: ${BACKUP_STALE_AFTER_HOURS:-36}
      BACKUP_STALE_ALERT_INTERVAL_MS: ${BACKUP_STALE_ALERT_INTERVAL_MS:-900000}
      BACKUP_OFFSITE_STALE_AFTER_HOURS: ${BACKUP_OFFSITE_STALE_AFTER_HOURS:-48}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ERROR_SPIKE_THRESHOLD: ${ALERT_ERROR_SPIKE_THRESHOLD:-50}
      ALERT_ERROR_SPIKE_WINDOW_MINUTES: ${ALERT_ERROR_SPIKE_WINDOW_MINUTES:-15}
      ALERT_DISK_FREE_RATIO_MIN: ${ALERT_DISK_FREE_RATIO_MIN:-0.1}
      ALERT_DISK_FREE_GB_MIN: ${ALERT_DISK_FREE_GB_MIN:-10}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      AUDIT_RETENTION_INTERVAL_MS: ${AUDIT_RETENTION_INTERVAL_MS:-86400000}
      MARKITDOWN_URL: ${MARKITDOWN_URL:-http://kh-markitdown:8080}
    volumes:
      - knowledge_hub_dev_backups:/backups
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - knowledge_hub_dev_net

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_REWRITE_API_ORIGIN: ${INTERNAL_API_URL:-http://api:3101}
    container_name: knowledge-hub-dev-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: development
      WEB_PORT: 3100
      API_URL: http://api:3101
      WEB_URL: http://localhost:3100
      DATABASE_URL: postgres://knowledge_hub:knowledge_hub@postgres:5432/knowledge_hub
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:3100:3100'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - knowledge_hub_dev_net

  # Document/image → Markdown (MarkItDown). Used by api/worker document-import jobs.
  # docker compose --profile markitdown up -d kh-markitdown
  # Or with full stack: docker compose --profile full --profile markitdown up -d
  kh-markitdown:
    profiles: ['markitdown', 'full']
    build:
      context: ./infrastructure/markitdown
      dockerfile: Dockerfile
    container_name: knowledge-hub-dev-kh-markitdown
    restart: unless-stopped
    environment:
      VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-gpt-4o-mini}
      TESSERACT_LANG: ${TESSERACT_LANG:-eng}
    ports:
      - '127.0.0.1:8088:8080'
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          'http://127.0.0.1:8080/health',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - knowledge_hub_dev_net

  # Ops-0 scheduler (same loop as Dokploy). Scripts baked into the image — see db-backup.Dockerfile.
  # Disable with BACKUP_ENABLED=false or Admin schedule.
  db-backup:
    image: knowledge-hub-db-backup:dev
    build:
      context: .
      dockerfile: infrastructure/docker/db-backup.Dockerfile
    container_name: knowledge-hub-dev-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: knowledge_hub
      POSTGRES_USER: knowledge_hub
      POSTGRES_PASSWORD: knowledge_hub
      BACKUP_DIR: /backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-3}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-1}
      # Empty: skip startup dump when last success is younger than the schedule interval. 0 always dumps.
      BACKUP_STARTUP_MIN_AGE_SECONDS: ${BACKUP_STARTUP_MIN_AGE_SECONDS:-}
    volumes:
      - knowledge_hub_dev_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowledge_hub_dev_net

volumes:
  knowledge_hub_dev_postgres_data:
    name: knowledge_hub_dev_postgres_data
  knowledge_hub_dev_redis_data:
    name: knowledge_hub_dev_redis_data
  knowledge_hub_dev_backups:
    name: knowledge_hub_dev_backups

networks:
  knowledge_hub_dev_net:
    name: knowledge_hub_dev_net
