# Dokploy PARALLEL preview stack for branch feature/new-design.
# Every service, image tag, volume, and DNS name is prefixed `nd-` / `dokploy-nd`
# so this app can run beside the live KnowHub stack on the same Dokploy host
# without stealing Docker DNS, overwriting images, or reusing volumes.
#
# Create a *new* Dokploy Compose service (do not reuse the live app). Point it at
# this branch, this file, and a distinct public domain. Attach Traefik to `nd-web`.
#
# Usage (local validation):
#   docker compose -f compose.dokploy.yaml --env-file .env.dokploy.example up --build
# Dokploy: attach this file; set env on the Compose *service* Environment tab (not only project).
#
# Browser → nd-web only. Next rewrites /api/v1 and /mcp to nd-api (baked at image build).
#
# Networking: app traffic runs on the project-scoped Compose default network. Only `nd-web`
# and `nd-api` also join external `dokploy-network`, because Traefik domain routing needs
# them there (Dokploy domain injection historically drops custom-only networks on the
# published service). Never put postgres/redis/worker/db-backup on `dokploy-network`.
# Do not reuse generic names `api` / `web` / `postgres` / `redis` — those aliases on
# dokploy-network belong to other apps (including live KnowHub).

x-app-env: &app-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-staging}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Discrete Postgres vars — apps rebuild DATABASE_URL with encodeURIComponent so
  # passwords containing &, #, @, * do not break auth (Compose string concat is unsafe).
  POSTGRES_USER: ${POSTGRES_USER:-knowledge_hub}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
  POSTGRES_HOST: nd-postgres
  # Legacy fallback URL (password not encoded). Prefer POSTGRES_* above.
  DATABASE_URL: postgres://${POSTGRES_USER:-knowledge_hub}:${POSTGRES_PASSWORD}@nd-postgres:5432/${POSTGRES_DB:-knowledge_hub}
  REDIS_URL: redis://nd-redis:6379
  WEB_URL: ${WEB_URL:?WEB_URL is required}
  API_URL: http://nd-api:3101
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  # OIDC SSO (Authentik). All three empty = button hidden; all three set = enabled.
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with SSO}
  OIDC_IDP_SOURCE: ${OIDC_IDP_SOURCE:-authentik}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
  SEARCH_HYBRID_ENABLED: ${SEARCH_HYBRID_ENABLED:-false}
  MAIL_DRIVER: ${MAIL_DRIVER:-console}
  BLOB_PROVIDER: ${BLOB_PROVIDER:-disabled}
  BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-}
  BLOB_S3_REGION: ${BLOB_S3_REGION:-auto}
  BLOB_S3_ENDPOINT: ${BLOB_S3_ENDPOINT:-}
  BLOB_S3_ACCESS_KEY_ID: ${BLOB_S3_ACCESS_KEY_ID:-}
  BLOB_S3_SECRET_ACCESS_KEY: ${BLOB_S3_SECRET_ACCESS_KEY:-}
  BLOB_S3_FORCE_PATH_STYLE: ${BLOB_S3_FORCE_PATH_STYLE:-false}
  # Isolate objects from the live stack if both share one bucket.
  BLOB_KEY_PREFIX: ${BLOB_KEY_PREFIX:-new-design/}
  # Local filesystem fallbacks when BLOB_PROVIDER=disabled. Absolute paths on the
  # shared nd_knowledge_hub_data volume so api + worker see the same bytes (imports,
  # media, avatars, style-pack logos). Relative ./data/* under /app is not writable as uid 1001.
  DATA_DIR: ${DATA_DIR:-/data}
  AVATAR_UPLOAD_DIR: ${AVATAR_UPLOAD_DIR:-/data/avatars}
  MEDIA_UPLOAD_DIR: ${MEDIA_UPLOAD_DIR:-/data/media}
  DOCUMENT_IMPORT_DIR: ${DOCUMENT_IMPORT_DIR:-/data/imports}
  STYLE_PACK_UPLOAD_DIR: ${STYLE_PACK_UPLOAD_DIR:-/data/style-packs}
  BACKUP_OFFSITE: ${BACKUP_OFFSITE:-true}
  BACKUP_OFFSITE_SYNC_INTERVAL_MS: ${BACKUP_OFFSITE_SYNC_INTERVAL_MS:-300000}
  MARKITDOWN_URL: ${MARKITDOWN_URL:-http://nd-markitdown:8080}
  MARKITDOWN_TIMEOUT_MS: ${MARKITDOWN_TIMEOUT_MS:-120000}
  DOCUMENT_IMPORT_MAX_BYTES: ${DOCUMENT_IMPORT_MAX_BYTES:-26214400}
  DOCUMENT_IMPORT_OCR_ENGINE: ${DOCUMENT_IMPORT_OCR_ENGINE:-none}
  VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
  VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
  VISION_LLM_MODEL: ${VISION_LLM_MODEL:-gpt-4o-mini}
  TESSERACT_LANG: ${TESSERACT_LANG:-eng}

services:
  nd-postgres:
    image: pgvector/pgvector:pg16
    container_name: kh-nd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - nd_knowledge_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Internal only — never join dokploy-network (see file header).
    networks:
      - default

  nd-redis:
    image: redis:7-alpine
    container_name: kh-nd-redis
    restart: unless-stopped
    volumes:
      - nd_knowledge_hub_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    # Internal only — see nd-postgres.
    networks:
      - default

  # Migrate + seed in one one-shot so they share a single env block. A separate
  # `seed` service repeatedly got a different POSTGRES_PASSWORD from Dokploy
  # injection (migrate OK, seed 28P01). --remove-orphans drops the old seed container.
  nd-migrate:
    # Reuse the image built by `nd-api` (no build: here). Compose builds images first,
    # then starts migrate — so the tag exists before this one-shot runs. Avoids a
    # second parallel api.Dockerfile build that OOMs smaller Dokploy hosts.
    image: knowledge-hub-api:dokploy-nd
    container_name: kh-nd-migrate
    pull_policy: never
    restart: 'no'
    # Bypass api-entrypoint (backup chown) and disable api HEALTHCHECK (no :3101 here).
    # Clear image CMD so it is not passed as args to the migrate script.
    entrypoint: ['/migrate-and-seed.sh']
    command: []
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-staging}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
      POSTGRES_HOST: nd-postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-knowledge_hub}:${POSTGRES_PASSWORD}@nd-postgres:5432/${POSTGRES_DB:-knowledge_hub}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Default Organization}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-default}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
    depends_on:
      nd-postgres:
        condition: service_healthy
    networks:
      - default

  nd-api:
    image: knowledge-hub-api:dokploy-nd
    container_name: kh-nd-api
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 3101
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Default Organization}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-default}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_MAX_UPLOAD_BYTES: ${BACKUP_MAX_UPLOAD_BYTES:-536870912}
      # System Chromium in api image (knowledge PDF export via Puppeteer)
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      HOME: /home/knowledgehub
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
    volumes:
      - nd_knowledge_hub_backups:/backups
      - nd_knowledge_hub_data:/data
    depends_on:
      nd-postgres:
        condition: service_healthy
      nd-redis:
        condition: service_healthy
      nd-migrate:
        condition: service_completed_successfully
      nd-markitdown:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - default
      - dokploy-network

  nd-worker:
    image: knowledge-hub-worker:dokploy-nd
    container_name: kh-nd-worker
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
    volumes:
      - nd_knowledge_hub_backups:/backups
      - nd_knowledge_hub_data:/data
    depends_on:
      nd-postgres:
        condition: service_healthy
      nd-redis:
        condition: service_healthy
      nd-migrate:
        condition: service_completed_successfully
      nd-markitdown:
        condition: service_started
    networks:
      - default

  nd-web:
    image: knowledge-hub-web:dokploy-nd
    container_name: kh-nd-web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Hardcoded on purpose — do not pass Dokploy API_URL=localhost into the build.
        NEXT_REWRITE_API_ORIGIN: http://nd-api:3101
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-staging}
      WEB_PORT: 3100
      PORT: 3100
      HOSTNAME: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      # SSR → nd-api over Compose DNS (must not be localhost).
      API_URL: http://nd-api:3101
      # Import form defaults / OCR option availability (SSR only).
      DOCUMENT_IMPORT_OCR_ENGINE: ${DOCUMENT_IMPORT_OCR_ENGINE:-none}
      VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
    # Traefik (Dokploy Domains) reaches the container port; avoid publishing to the host.
    expose:
      - '3100'
    depends_on:
      nd-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 35s
    networks:
      - default
      - dokploy-network

  # Document/image → Markdown (Microsoft MarkItDown). Project network only.
  nd-markitdown:
    build:
      context: ./infrastructure/markitdown
      dockerfile: Dockerfile
    image: knowledge-hub-markitdown:dokploy-nd
    container_name: kh-nd-markitdown
    restart: unless-stopped
    environment:
      VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-gpt-4o-mini}
      TESSERACT_LANG: ${TESSERACT_LANG:-eng}
    networks:
      - default

  # Ops-0 (NF-005): scheduled pg_dump -Fc onto a named volume + retention + last-success stamp.
  # Scripts are baked into the image (not bind-mounted from the git checkout). Dokploy replaces
  # the clone on each deploy; a long-running bind mount then loses /scripts/*.sh mid-sleep.
  # Disable with BACKUP_ENABLED=false. Offsite upload is Ops-1 (after BlobStore).
  nd-db-backup:
    image: knowledge-hub-db-backup:dokploy-nd
    container_name: kh-nd-db-backup
    build:
      context: .
      dockerfile: infrastructure/docker/db-backup.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: nd-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-3}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-1}
    volumes:
      - nd_knowledge_hub_backups:/backups
    depends_on:
      nd-postgres:
        condition: service_healthy
    networks:
      - default

# Project-scoped volume keys (Compose prefixes with -p project). Distinct from the
# live stack's knowledge_hub_* keys even if a compose project name were reused.
volumes:
  nd_knowledge_hub_postgres_data:
  nd_knowledge_hub_redis_data:
  nd_knowledge_hub_backups:
  nd_knowledge_hub_data:

networks:
  dokploy-network:
    external: true
